name: Manual Tests

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: Branch, tag, or commit to test
        required: true
        default: WebReBuild
        type: string

permissions:
  contents: read

concurrency:
  group: manual-tests-${{ inputs.target_ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Windows Python 3.11
    runs-on: windows-latest
    timeout-minutes: 30

    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out target ref
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.target_ref }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Show Python environment
        shell: pwsh
        run: |
          python --version
          python -m pip --version

      - name: Upgrade pip
        shell: pwsh
        run: python -m pip install --upgrade pip

      - name: Prepare test results directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force test-results | Out-Null

      - name: Run full pytest suite
        shell: pwsh
        run: .\scripts\test.ps1 -Install -PytestArgs '--junitxml=test-results/pytest.xml'

      - name: Run FastAPI smoke test
        shell: pwsh
        run: python -c "from backend.main import create_app; assert create_app().title == 'AITranslator API'"

      - name: Upload pytest report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-results-${{ github.run_id }}
          path: test-results/pytest.xml
          if-no-files-found: warn
          retention-days: 14
