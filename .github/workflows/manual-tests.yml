name: Manual Tests

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: Branch, tag, or commit to test
        required: true
        default: electronrebuild
        type: string
      scope:
        description: Verification scope
        required: true
        default: all
        type: choice
        options:
          - all
          - backend
          - frontend
          - rag
          - sandbox
          - electron
          - tauri
          - full

permissions:
  contents: read

concurrency:
  group: manual-tests-${{ inputs.target_ref }}-${{ inputs.scope }}
  cancel-in-progress: false

jobs:
  backend:
    if: ${{ inputs.scope == 'all' || inputs.scope == 'backend' }}
    name: Backend verification
    runs-on: windows-latest
    timeout-minutes: 35

    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out target ref
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.target_ref }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Prepare test results directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force test-results | Out-Null

      - name: Run backend verification
        shell: pwsh
        run: .\scripts\verify.ps1 -Scope Backend -Install -PytestArgs '--junitxml=test-results/pytest.xml'

      - name: Upload pytest report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: manual-backend-${{ github.run_id }}
          path: test-results/pytest.xml
          if-no-files-found: warn
          retention-days: 14

  frontend:
    if: ${{ inputs.scope == 'all' || inputs.scope == 'frontend' }}
    name: Frontend verification
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out target ref
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.target_ref }}

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Run frontend verification
        shell: pwsh
        run: .\scripts\verify.ps1 -Scope Frontend -Install

  rag:
    if: ${{ inputs.scope == 'all' || inputs.scope == 'rag' }}
    name: RAG verification
    runs-on: windows-latest
    timeout-minutes: 30

    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out target ref
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.target_ref }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run RAG contracts without GPU models
        shell: pwsh
        run: python -m pytest -q tests/rag -m "not rag_gpu"

  sandbox:
    if: ${{ inputs.scope == 'all' || inputs.scope == 'sandbox' }}
    name: Sandbox verification
    runs-on: windows-latest
    timeout-minutes: 30

    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out target ref
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.target_ref }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run Sandbox contracts without Docker integration
        shell: pwsh
        run: python -m pytest -q tests/sandbox -m "not docker_integration"

  electron:
    if: ${{ inputs.scope == 'all' || inputs.scope == 'electron' }}
    name: Electron verification
    runs-on: windows-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: apps/desktop

    steps:
      - name: Check out target ref
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.target_ref }}

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install desktop dependencies
        run: npm ci --no-audit --prefer-offline

      - name: Compile Electron shell
        if: ${{ hashFiles('apps/desktop/tsconfig.electron.json') != '' }}
        run: npm run electron:compile

      - name: Run Electron contracts
        if: ${{ hashFiles('apps/desktop/tsconfig.electron.json') != '' }}
        run: npm run test:electron-contracts

      - name: Smoke test Electron credential vault
        if: ${{ hashFiles('apps/desktop/scripts/electron-credential-smoke.mjs') != '' }}
        run: node scripts/electron-credential-smoke.mjs

      - name: Electron not present on target ref
        if: ${{ hashFiles('apps/desktop/tsconfig.electron.json') == '' }}
        shell: pwsh
        run: Write-Host "Electron shell is not present on the selected ref."

  tauri:
    if: ${{ inputs.scope == 'all' || inputs.scope == 'tauri' }}
    name: Tauri verification
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out target ref
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.target_ref }}

      - name: Set up Rust
        if: ${{ hashFiles('apps/desktop/src-tauri/Cargo.toml') != '' }}
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Run Tauri verification
        if: ${{ hashFiles('apps/desktop/src-tauri/Cargo.toml') != '' }}
        shell: pwsh
        run: .\scripts\verify.ps1 -Scope Tauri

      - name: Tauri not present on target ref
        if: ${{ hashFiles('apps/desktop/src-tauri/Cargo.toml') == '' }}
        shell: pwsh
        run: Write-Host "Tauri shell is not present on the selected ref."

  full:
    if: ${{ inputs.scope == 'full' }}
    name: Full Python regression
    runs-on: windows-latest
    timeout-minutes: 45

    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out target ref
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.target_ref }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Prepare test results directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force test-results | Out-Null

      - name: Run complete Python test suite
        shell: pwsh
        run: .\scripts\test.ps1 -Install -PytestArgs '--junitxml=test-results/pytest-full.xml'

      - name: Upload full regression report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: manual-full-regression-${{ github.run_id }}
          path: test-results/pytest-full.xml
          if-no-files-found: warn
          retention-days: 14
