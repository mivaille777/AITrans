name: Electron Release Readiness

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: electron-release-readiness-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release_candidate:
    name: Windows release candidate
    runs-on: windows-latest
    timeout-minutes: 120

    env:
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            aitranslator-rag-requirements.txt

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Verify tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $expected = "v$version"
          if ("${{ github.ref_name }}" -ne $expected) {
            throw "Git tag '${{ github.ref_name }}' does not match VERSION '$expected'."
          }

      - name: Install Python release dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,build]" -r aitranslator-rag-requirements.txt
          python -m pip check

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm ci --no-audit --prefer-offline

      - name: Build verified release candidate
        working-directory: apps/desktop
        run: npm run desktop:release-candidate

      - name: Upload release candidate
        uses: actions/upload-artifact@v7
        with:
          name: aitrans-windows-release-candidate-${{ github.ref_name }}-${{ github.sha }}
          path: |
            apps/desktop/out/make/squirrel.windows/x64/
            apps/desktop/out/release-manifest.json
          if-no-files-found: error
          retention-days: 30
