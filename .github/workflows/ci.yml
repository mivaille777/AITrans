name: CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - WebReBuild
      - electronrebuild
  push:
    branches:
      - main
      - WebReBuild
      - electronrebuild
      - "ci/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  python_quality:
    name: Python quality
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install quality dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Ruff critical correctness checks
        shell: pwsh
        run: python -m ruff check backend tests scripts --select E9,F63,F7,F82 --output-format=github

      - name: Report full Ruff baseline
        continue-on-error: true
        shell: pwsh
        run: python -m ruff check backend scripts --output-format=github

      - name: Compile backend modules
        shell: pwsh
        run: python -m compileall -q backend app

  python_contracts:
    name: Python contracts (${{ matrix.python-version }})
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"

    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and test dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Run API and unit contracts
        shell: pwsh
        run: python -m pytest -q tests/api tests/unit tests/test_backend_health.py

      - name: Run FastAPI smoke test
        shell: pwsh
        run: python -c "from backend.main import create_app; assert create_app().title == 'AITranslator API'"

  rag_sandbox_contracts:
    name: RAG and Sandbox contracts
    runs-on: windows-latest
    timeout-minutes: 30

    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and test dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Run RAG contracts without GPU models
        shell: pwsh
        run: python -m pytest -q tests/rag -m "not rag_gpu"

      - name: Run Sandbox contracts without Docker integration
        shell: pwsh
        run: python -m pytest -q tests/sandbox -m "not docker_integration"

  runtime_contracts:
    name: Agent runtime contracts
    runs-on: windows-latest
    timeout-minutes: 20

    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install runtime test dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Run multi-agent contracts
        shell: pwsh
        run: python -m pytest -q tests/multi_agent

      - name: Run crash, concurrency, and long-task contracts
        shell: pwsh
        run: python -m pytest -q tests/integration

  web_frontend:
    name: React lint, tests, and build
    runs-on: windows-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: apps/desktop

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --no-audit --prefer-offline

      - name: Lint frontend
        run: npm run lint

      - name: Test frontend
        run: npm run test

      - name: Build frontend
        run: npm run build

  electron_shell:
    name: Electron shell contracts
    runs-on: windows-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: apps/desktop

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install desktop dependencies
        run: npm ci --no-audit --prefer-offline

      - name: Compile Electron main and preload
        if: ${{ hashFiles('apps/desktop/tsconfig.electron.json') != '' }}
        run: npm run electron:compile

      - name: Run Electron runtime and security contracts
        if: ${{ hashFiles('apps/desktop/tsconfig.electron.json') != '' }}
        run: npm run test:electron-contracts

      - name: Smoke test Electron credential vault
        if: ${{ hashFiles('apps/desktop/scripts/electron-credential-smoke.mjs') != '' }}
        run: node scripts/electron-credential-smoke.mjs

      - name: Electron not present on this branch
        if: ${{ hashFiles('apps/desktop/tsconfig.electron.json') == '' }}
        shell: pwsh
        run: Write-Host "Electron shell is not present on this branch; Electron checks are not applicable."

  tauri_shell:
    name: Tauri shell contracts
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Rust
        if: ${{ hashFiles('apps/desktop/src-tauri/Cargo.toml') != '' }}
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Check Rust formatting baseline
        if: ${{ hashFiles('apps/desktop/src-tauri/Cargo.toml') != '' }}
        continue-on-error: true
        shell: pwsh
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml -- --check

      - name: Run Clippy
        if: ${{ hashFiles('apps/desktop/src-tauri/Cargo.toml') != '' }}
        shell: pwsh
        run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --locked --no-default-features --all-targets -- -D warnings

      - name: Run Rust tests
        if: ${{ hashFiles('apps/desktop/src-tauri/Cargo.toml') != '' }}
        shell: pwsh
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --locked --no-default-features

      - name: Build and link Tauri shell
        if: ${{ hashFiles('apps/desktop/src-tauri/Cargo.toml') != '' }}
        shell: pwsh
        run: cargo build --manifest-path apps/desktop/src-tauri/Cargo.toml --locked --no-default-features

      - name: Tauri not present on this branch
        if: ${{ hashFiles('apps/desktop/src-tauri/Cargo.toml') == '' }}
        shell: pwsh
        run: Write-Host "Tauri shell is not present on this branch; Tauri checks are not applicable."

  quality_gate:
    name: CI quality gate
    if: always()
    needs:
      - python_quality
      - python_contracts
      - rag_sandbox_contracts
      - runtime_contracts
      - web_frontend
      - electron_shell
      - tauri_shell
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Verify required CI jobs
        shell: bash
        run: |
          declare -A results=(
            ["Python quality"]="${{ needs.python_quality.result }}"
            ["Python contracts"]="${{ needs.python_contracts.result }}"
            ["RAG and Sandbox contracts"]="${{ needs.rag_sandbox_contracts.result }}"
            ["Agent runtime contracts"]="${{ needs.runtime_contracts.result }}"
            ["React lint, tests, and build"]="${{ needs.web_frontend.result }}"
            ["Electron shell contracts"]="${{ needs.electron_shell.result }}"
            ["Tauri shell contracts"]="${{ needs.tauri_shell.result }}"
          )

          failed=0
          for name in "${!results[@]}"; do
            result="${results[$name]}"
            echo "$name: $result"
            if [[ "$result" != "success" ]]; then
              failed=1
            fi
          done

          exit "$failed"
