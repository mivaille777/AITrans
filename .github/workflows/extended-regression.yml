name: Extended Regression

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - WebReBuild
      - electronrebuild

permissions:
  contents: read

concurrency:
  group: extended-regression-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  full_python_regression:
    name: Full Python regression
    runs-on: windows-latest
    timeout-minutes: 45

    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Prepare test results directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force test-results | Out-Null

      - name: Run complete Python test suite
        shell: pwsh
        run: .\scripts\test.ps1 -Install -PytestArgs '--junitxml=test-results/pytest-full.xml'

      - name: Upload full regression report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: extended-python-${{ github.run_id }}
          path: test-results/pytest-full.xml
          if-no-files-found: warn
          retention-days: 14
