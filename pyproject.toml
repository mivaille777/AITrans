[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "desktop-translator"
version = "0.1.0"
description = "Local business backend for the AITranslator React/Tauri desktop application."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pywin32>=306",
    # Retained for the headless Windows clipboard selection fallback.
    "pynput>=1.7.6",
    "cachetools>=5.3",
    "certifi>=2024.8.30",
    # Web-compatible translation providers use a persistent browser-like HTTP session.
    "requests>=2.32,<3",
    # Youdao WebFanyi returns an AES-CBC encrypted response body.
    "pycryptodome>=3.20,<4",
    "uiautomation>=2.0.18",
    "openai>=1.0",
    "fastapi>=0.116,<1",
    "pydantic>=2.10,<3",
    "uvicorn[standard]>=0.35,<1",
    # LangGraph is the stateful orchestration layer for chat/workspace/tool execution.
    "langgraph>=1.2,<1.3",
    # Local Document Agent and RAG ingestion tools remain deterministic.
    "pypdf>=5.0,<6",
    "python-docx>=1.1,<2",
    "lxml>=6.0,<7",
    # Qdrant Local is imported by the normal FastAPI RAG runtime, so it is a
    # core runtime dependency rather than an optional GPU/model dependency.
    "qdrant-client>=1.19,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "httpx>=0.27,<1",
    "ruff>=0.12,<1",
]
studio = [
    # Local Agent Server + LangSmith Studio development only.
    "langgraph-cli[inmem]>=0.4.31,<0.5",
]
build = [
    "pyinstaller>=6.10,<7",
]
rag-advanced = [
    # Optional scientific-PDF parsing. The minimum version supports the
    # page-aware Markdown export path used to retain citation provenance.
    # OCR and formula enrichment remain disabled by default.
    "docling>=2.115,<3",
]

[project.scripts]
aitrans-backend = "backend.main:main"

[tool.setuptools.packages.find]
include = ["app*", "backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"
markers = [
    "rag_gpu: opt-in tests that load real local RAG models and require suitable hardware",
]
